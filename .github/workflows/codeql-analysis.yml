name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # Sundays 03:00 UTC
  workflow_dispatch:

# Least privilege: the job overrides only what analysis needs.
permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Job-level permissions replace the workflow default, so each scope must
      # be re-declared: contents for checkout, security-events to upload SARIF
      # to the code-scanning dashboard, and actions for the upload step's
      # workflow-run API call (private repos 403 without it — see
      # github/codeql-action#2117).
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The Rust backend (src-tauri) is not yet supported by CodeQL;
        # this covers the React/TypeScript frontend.
        language: ['javascript-typescript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7

      # This repo is private, and GitHub code scanning (SARIF dashboard)
      # requires the paid GitHub Code Security / Advanced Security product on
      # private repos. The analysis itself is free and runs fine, but the
      # upload API 403s with "Code scanning is not enabled for this
      # repository". upload: never keeps the scan running (findings print in
      # the job log) without failing every push. When the repo gains code
      # scanning (enable it in Settings > Code security and analysis, or make
      # the repo public), flip upload to 'always' to populate the dashboard.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
