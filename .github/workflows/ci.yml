name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Declare default permissions as read only (the e2e job overrides with the
# pull-requests: write it needs for the flaky-gate comment).
permissions: read-all

jobs:
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run test -- --coverage
      - run: npm run build

  backend:
    name: Backend (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch; resolves latest stable Rust at runtime
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: cargo check
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt -- --check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The browser download can stall for tens of minutes with no output (a
      # Playwright CDN/apt degradation wedged every E2E job for 40+ min once).
      # Fail fast per attempt, retry, and cap the whole step so a stall becomes
      # a quick surfaced failure instead of a 6-hour silent hang.
      - name: Install Playwright browsers (retried)
        timeout-minutes: 30
        run: |
          for attempt in 1 2 3; do
            echo "playwright install attempt $attempt/3"
            if timeout 600 npx playwright install --with-deps chromium webkit; then
              echo "playwright browsers installed"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1
      - run: npm run test:e2e:ci
      # Only reached when the gate above failed. Posts a PR comment listing the
      # flaky tests (check-e2e-flaky.mjs writes test-results/flaky-tests.txt before
      # exiting non-zero); skips silently when the failure was something else.
      # Sticky: finds the previous comment via a hidden marker and updates it in
      # place, so repeated flaky runs pile up one comment instead of many.
      - name: Comment flaky tests on the PR
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('node:fs');
            const reportPath = 'test-results/flaky-tests.txt';
            if (!fs.existsSync(reportPath)) {
              console.log('No flaky-tests report found; e2e failed for another reason. Skipping PR comment.');
              return;
            }
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('Not a pull_request event; nothing to comment on.');
              return;
            }
            const tests = fs
              .readFileSync(reportPath, 'utf8')
              .trim()
              .split('\n')
              .map((line) => `- \`${line}\``)
              .join('\n');
            // Hidden marker lets us find and update this comment on later runs.
            const marker = '<!-- flaky-e2e-gate -->';
            const body = [
              '## ⚠️ Flaky e2e tests detected',
              '',
              `The e2e flake gate found **${tests.length} test(s)** that passed only after a retry (run: ${context.runId}):`,
              '',
              tests,
              '',
              'Flakiness is surfaced on purpose — please root-cause these instead of relying on retries.',
              marker,
            ].join('\n');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const previous = comments.find((c) => c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
              console.log(`Updated sticky flaky-test comment (id ${previous.id}) on PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
              console.log(`Posted sticky flaky-test comment on PR #${pr.number}.`);
            }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
