name: Release

on:
  # Stage 1: start a release. Bumps the version everywhere, generates the
  # changelog from conventional commits, and opens a release/vX.Y.Z PR (main
  # is branch-protected: the PR needs a review + green checks to merge).
  workflow_dispatch:
    inputs:
      version:
        description: 'New semver to release, e.g. 1.6.0 (leave empty to only (re)publish a tag)'
        required: false
        type: string
      publish_tag:
        description: 'Existing vX.Y.Z tag to (re)publish without cutting a new release'
        required: false
        type: string
  # Stage 2 + 3: when a release/v* PR merges to main, the `tag` job tags the
  # merge commit and `publish` runs in the same workflow run to build the
  # installer and publish the GitHub Release. (A human reviews and merges the
  # stage-1 PR.)
  #
  # Publishing must be part of this run: a tag pushed with GITHUB_TOKEN does
  # not fire a `push` workflow event, so a tag-triggered publish stage would
  # silently never run. The tag trigger below is kept for human-pushed tags
  # and as a re-publish path.
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # need tags + history for the changelog range

      - name: Validate version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be a semver like 1.6.0 (got $VERSION)"
            exit 1
          fi
          if git tag -l "v$VERSION" | grep -q .; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=release/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version across manifests
        run: node scripts/bump-version.mjs "${{ steps.version.outputs.version }}"

      - name: Generate changelog from commits
        run: node scripts/generate-changelog.mjs "${{ steps.version.outputs.version }}"

      - name: Verify version consistency
        run: npm run version:check

      - name: Commit, push, and open the release PR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json src-tauri/Cargo.toml CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push -u origin "$BRANCH"
          BODY="Auto-generated by the Release workflow.

          Version bumped in package.json, package-lock.json, and src-tauri/Cargo.toml; CHANGELOG.md generated from conventional commits since the last tag.

          Once reviewed and merged, the workflow tags \`v$VERSION\` and publishes the installer to a GitHub Release."
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "$BODY"

  tag:
    name: Tag release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag the merge commit
        id: create
        run: |
          VERSION="${{ github.event.pull_request.head.ref }}"
          VERSION="${VERSION#release/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pushed tag v$VERSION at ${{ github.event.pull_request.merge_commit_sha }}"

  publish:
    name: Publish installer
    needs: [tag]
    # Runs in the same run that created the tag (release PR merged), when a
    # human pushes / re-pushes a v* tag, or when dispatched with publish_tag to
    # (re)publish an existing tag. `always()` is required so this job still runs
    # when the `tag` job was skipped (push/dispatch events).
    if: |
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') ||
        needs.tag.result == 'success'
      )
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    # windows-latest defaults `run:` to pwsh, where a bare $VAR is a PowerShell
    # variable (empty!) rather than the environment variable GITHUB_ENV set —
    # which silently passed an empty version argument. Default to bash and let
    # the one pwsh step opt in explicitly.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build from the tag itself: the tag created moments ago by `tag`, an
          # explicitly requested existing tag, or the pushed tag ref.
          ref: ${{ needs.tag.outputs.tag || inputs.publish_tag || github.ref }}

      - name: Resolve version
        shell: bash
        run: |
          # A tag push carries the version in the ref; a same-run publish takes
          # it from the PR branch name; a (re)publish dispatch names the tag.
          # All paths export VERSION/RELEASE_TAG for the steps below.
          if [ -n "${{ inputs.publish_tag }}" ]; then
            VERSION="${{ inputs.publish_tag }}"
            VERSION="${VERSION#v}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${{ github.event.pull_request.head.ref }}"
            VERSION="${VERSION#release/}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not resolve a release version from this run (got '$VERSION')"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION does not exist — publish requires an existing tag"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version $VERSION (tag v$VERSION)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch; resolves latest stable Rust at runtime

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build release installer
        run: npm run tauri build

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          ARTIFACTS=$(find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) | tr '\n' ' ')
          if [ -z "$ARTIFACTS" ]; then
            echo "::error::no installer artifacts found under src-tauri/target/release/bundle"
            exit 1
          fi
          echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"

      - name: Package web bundle
        id: web
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not (Test-Path 'dist')) {
            Write-Error "dist/ not found — frontend bundle missing after build"
            exit 1
          }
          $archive = "winget-system-manager-web-$version.zip"
          Compress-Archive -Path 'dist' -DestinationPath $archive -Force
          # AppendAllText is always UTF-8 without BOM, so GITHUB_OUTPUT
          # parses correctly under both pwsh and Windows PowerShell
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "web_archive=$archive`n")

      - name: Generate SHA256 checksums
        id: checksums
        shell: bash
        run: |
          SUMS="SHA256SUMS-$VERSION.txt"
          : > "$SUMS"
          for f in ${{ steps.artifacts.outputs.artifacts }} ${{ steps.web.outputs.web_archive }}; do
            # hash from each artifact's directory so the SUMS file lists
            # clean relative filenames (verifiable with sha256sum -c)
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$SUMS"
          done
          echo "checksums=$SUMS" >> "$GITHUB_OUTPUT"
          echo "Generated $SUMS:"
          cat "$SUMS"

      - name: Sign checksums with the release key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          SUMS="SHA256SUMS-$VERSION.txt"
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_GPG_PRIVATE_KEY secret is not set — refusing to publish an unsigned release"
            echo "::error::add the release signing key (see docs/RELEASE.md) then re-run this job"
            exit 1
          fi
          # $RUNNER_TEMP is a Windows path on windows-latest, and Git Bash's
          # gpg needs a POSIX one — otherwise the keyring path is mangled
          # ("D:\a\_temp/gnupg/pubring.kbx": No such file or directory).
          if command -v cygpath >/dev/null 2>&1; then
            GNUPG_HOME="$(cygpath -u "$RUNNER_TEMP")/gnupg"
          else
            GNUPG_HOME="$RUNNER_TEMP/gnupg"
          fi
          export GNUPGHOME="$GNUPG_HOME"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$GPG_PASSPHRASE" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o "$SUMS.asc" "$SUMS"
          else
            gpg --batch --yes --detach-sign --armor -o "$SUMS.asc" "$SUMS"
          fi
          echo "Signed $SUMS with key:"
          gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print $10 }'

      - name: Extract release notes
        run: |
          node scripts/extract-release-notes.mjs "$VERSION" release-notes.md
          # surface the hashes on the release page so users can verify
          # without downloading the SUMS file first
          {
            printf '\n## Checksums (SHA256)\n\n```text\n'
            cat "SHA256SUMS-$VERSION.txt"
            printf '```\n'
          } >> release-notes.md

      - name: Create GitHub Release
        run: |
          # shellcheck disable=SC2086
          gh release create "$RELEASE_TAG" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            ${{ steps.artifacts.outputs.artifacts }} \
            "${{ steps.web.outputs.web_archive }}" \
            "SHA256SUMS-$VERSION.txt" \
            "SHA256SUMS-$VERSION.txt.asc"
