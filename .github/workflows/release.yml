name: Release

on:
  # Stage 1: start a release. Bumps the version everywhere, generates the
  # changelog from conventional commits, and opens a release/vX.Y.Z PR (main
  # is branch-protected: the PR needs a review + green checks to merge).
  workflow_dispatch:
    inputs:
      version:
        description: 'New semver to release, e.g. 1.6.0'
        required: true
        type: string
  # Stage 2: when a release/v* PR merges to main, tag the merge commit so
  # stage 3 picks it up. (Human reviews and merges the stage-1 PR.)
  pull_request:
    types: [closed]
    branches: [main]
  # Stage 3: build the installer from the tag and publish the GitHub Release.
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # need tags + history for the changelog range

      - name: Validate version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be a semver like 1.6.0 (got $VERSION)"
            exit 1
          fi
          if git tag -l "v$VERSION" | grep -q .; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=release/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version across manifests
        run: node scripts/bump-version.mjs "${{ steps.version.outputs.version }}"

      - name: Generate changelog from commits
        run: node scripts/generate-changelog.mjs "${{ steps.version.outputs.version }}"

      - name: Verify version consistency
        run: npm run version:check

      - name: Commit, push, and open the release PR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json src-tauri/Cargo.toml CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push -u origin "$BRANCH"
          BODY="Auto-generated by the Release workflow.

          Version bumped in package.json, package-lock.json, and src-tauri/Cargo.toml; CHANGELOG.md generated from conventional commits since the last tag.

          Once reviewed and merged, the workflow tags \`v$VERSION\` and publishes the installer to a GitHub Release."
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "$BODY"

  tag:
    name: Tag release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag the merge commit
        run: |
          VERSION="${{ github.event.pull_request.head.ref }}"
          VERSION="${VERSION#release/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "v$VERSION"
          echo "Pushed tag v$VERSION at ${{ github.event.pull_request.merge_commit_sha }}"

  publish:
    name: Publish installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch; resolves latest stable Rust at runtime

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build release installer
        run: npm run tauri build

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          ARTIFACTS=$(find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) | tr '\n' ' ')
          if [ -z "$ARTIFACTS" ]; then
            echo "::error::no installer artifacts found under src-tauri/target/release/bundle"
            exit 1
          fi
          echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"

      - name: Package web bundle
        id: web
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          if (-not (Test-Path 'dist')) {
            Write-Error "dist/ not found — frontend bundle missing after build"
            exit 1
          }
          $archive = "winget-system-manager-web-$version.zip"
          Compress-Archive -Path 'dist' -DestinationPath $archive -Force
          # AppendAllText is always UTF-8 without BOM, so GITHUB_OUTPUT
          # parses correctly under both pwsh and Windows PowerShell
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "web_archive=$archive`n")

      - name: Generate SHA256 checksums
        id: checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SUMS="SHA256SUMS-$VERSION.txt"
          : > "$SUMS"
          for f in ${{ steps.artifacts.outputs.artifacts }} ${{ steps.web.outputs.web_archive }}; do
            # hash from each artifact's directory so the SUMS file lists
            # clean relative filenames (verifiable with sha256sum -c)
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$SUMS"
          done
          echo "checksums=$SUMS" >> "$GITHUB_OUTPUT"
          echo "Generated $SUMS:"
          cat "$SUMS"

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node scripts/extract-release-notes.mjs "$VERSION" release-notes.md
          # surface the hashes on the release page so users can verify
          # without downloading the SUMS file first
          {
            printf '\n## Checksums (SHA256)\n\n```text\n'
            cat "SHA256SUMS-$VERSION.txt"
            printf '```\n'
          } >> release-notes.md

      - name: Create GitHub Release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # shellcheck disable=SC2086
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            ${{ steps.artifacts.outputs.artifacts }} \
            "${{ steps.web.outputs.web_archive }}" \
            "SHA256SUMS-$VERSION.txt"
