[workspace]
members = [".", "fuzz"]
resolver = "2"

[package]
name = "winget-interface"
version = "1.5.0"
description = "WinGet System Manager - A Tauri-based desktop application for managing Windows packages"
authors = ["WinGet Interface Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
csv = "1.3"
keyring = "2"
regex = "1"
once_cell = "1"
tauri-plugin-single-instance = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-process = "2.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2"
futures-util = "0.3"
# Add llama-cpp-rs dependency for local LLM inference
llama_cpp = "0.3"
# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# SHA-256 hash verification for installer integrity
sha2 = "0.10"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
